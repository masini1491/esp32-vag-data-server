name: Host Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  host-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0

      - name: Compile host tests
        run: g++ -std=c++17 -Wall -Wextra -pedantic -I. tests/host/main.cpp -o "$RUNNER_TEMP/host_tests"

      - name: Run host tests
        run: "$RUNNER_TEMP/host_tests"

      - name: Run Web fixture tests
        run: node tests/web_fixture_tests.cjs
